<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"></head>
<body style="background:#fff;padding:20px;margin:0;font-family:Inter,system-ui;color:#252525;">
<div style="display:flex;flex-direction:column;gap:16px;">
  <div>
    <div style="font-size:11px;color:#7C7C7C;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px;">Underline tabs</div>
    <div style="display:flex;gap:24px;">
      <div style="padding:8px 0;border-bottom:2px solid #1C81EF;color:#1C81EF;font-weight:500;font-size:14px;">Overview</div>
      <div style="padding:8px 0;color:#515151;font-size:14px;">Activity</div>
      <div style="padding:8px 0;color:#515151;font-size:14px;">Settings</div>
      <div style="padding:8px 0;color:#A8A8A8;font-size:14px;">Billing</div>
    </div>
  </div>
  <div>
    <div style="font-size:11px;color:#7C7C7C;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px;">Segmented (switch)</div>
    <div style="display:inline-flex;gap:4px;padding:3px 4px;border:1px solid #E3E3E3;background:#fff;border-radius:8px;">
      <div style="padding:4px 10px;border-radius:6px;background:#1C81EF;color:#fff;font-size:12px;font-weight:500;">Day</div>
      <div style="padding:4px 10px;border-radius:6px;color:#515151;font-size:12px;font-weight:500;">Week</div>
      <div style="padding:4px 10px;border-radius:6px;color:#515151;font-size:12px;font-weight:500;">Month</div>
      <div style="padding:4px 10px;border-radius:6px;color:#515151;font-size:12px;font-weight:500;">Year</div>
    </div>
  </div>
</div>
</body></html>
